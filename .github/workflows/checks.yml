name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[dev,docs]'
          python -m pip check
      - name: Check source snapshot and approved bug-fix manifest
        run: python scripts/verify_snapshot.py
      - name: Run inherited and bug-fix regression tests
        run: python -m pytest -q
      - name: Compile simulator adapter sources
        run: python -m compileall -q tests/sim_ros2/src/mrsim
      - name: Exercise installed commands
        run: |
          multiroi-detect --help
          multiroi-nav --help
          multiroi-reference --help
          python examples/generate_sample.py
          multiroi-detect --input examples/data --results_dir outputs/detection
          multiroi-nav --input examples/data/corridor.mp4 --video --output outputs/video
          python scripts/check_example_outputs.py
      - name: Build technical documentation
        run: python scripts/build_technical_documentation.py
      - name: Build distributions
        run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: distributions-python-${{ matrix.python }}
          path: |
            dist/*
            docs/technical-documentation.pdf

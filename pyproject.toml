[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-roi-crop-navigation"
version = "0.1.0"
description = "Adaptive crop row detection and experimental visual navigation"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "A-C-Simon"}]
keywords = ["crop-rows", "computer-vision", "agricultural-robotics", "visual-servoing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
  "numpy>=1.24,<2",
  "opencv-python>=4.8,<4.12",
  "scipy>=1.10,<1.16",
  "scikit-learn>=1.3,<1.8",
]

[project.optional-dependencies]
dev = ["pytest>=7,<9", "build>=1.2,<2"]
docs = ["reportlab>=3.6.8,<5"]

[project.scripts]
multiroi-detect = "test_multi_roi:main"
multiroi-nav = "run_mr_navigation:main"
multiroi-reference = "multi_roi:main"

[project.urls]
Repository = "https://github.com/A-C-Simon/multi-roi-crop-navigation"
Documentation = "https://github.com/A-C-Simon/multi-roi-crop-navigation/tree/main/docs"
Issues = "https://github.com/A-C-Simon/multi-roi-crop-navigation/issues"
Original = "https://github.com/A-C-Simon/Crop_row_detection/tree/main/LinReg/MultiROI"

[tool.setuptools]
py-modules = [
  "multi_roi", "test_multi_roi", "temporal_filter", "lookahead_corridor_map",
  "mr_vs", "mr_navigation_stack", "run_mr_navigation",
]

[tool.pytest.ini_options]
testpaths = ["test_temporal_filter.py", "tests/unit"]
pythonpath = [".", "tests/unit"]
